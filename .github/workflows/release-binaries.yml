name: Release Binaries

on:
  push:
    tags:
      - '*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-binaries:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            extension: ''
            label: Linux x64
          - os: macos-latest
            target: macos-x64
            extension: ''
            label: macOS x64
          - os: windows-2022
            target: windows-x64
            extension: .exe
            label: Windows x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build sources
        run: npm run build

      - name: Package binary
        run: npm run build:binaries -- --target ${{ matrix.target }}

      - name: Smoke test binary
        run: node scripts/dist/smoke-test-binary.js release-assets/cm-packer-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.extension }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: cm-packer-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.extension }}
          path: release-assets/cm-packer-${{ github.ref_name }}-${{ matrix.target }}${{ matrix.extension }}

  publish-release:
    name: Publish Release Assets
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*